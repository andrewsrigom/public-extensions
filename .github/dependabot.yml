version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Routine version updates are reviewed deliberately so one lockfile refresh
    # cannot mix unrelated upgrades and downgrades. Security updates remain on.
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      action-updates:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
